name: Windows application
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Run unit and Tk interface tests
        run: python -m unittest discover -s tests -v
      - name: Install packaging tools
        run: python -m pip install -r requirements-build.txt
      - name: Build standalone Windows application
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name NJ-Cooking app.py
      - uses: actions/upload-artifact@v4
        with:
          name: NJ-Cooking-Windows
          path: dist/NJ-Cooking.exe
          if-no-files-found: error
